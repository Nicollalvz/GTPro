<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión — Rines y Llantas GT Pro</title>
    
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="apple-touch-icon" href="imagenes/app-icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8C1F1F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rines GT Pro">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="imagenes/logo-gt-pro.png" alt="Rines y Llantas GT Pro" class="logo-navbar">
                <span class="logo-texto d-none d-sm-inline">RINES & LLANTAS GT <span>PRO</span></span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Volver al Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="login-seccion">
        <div class="login-caja" style="max-width:480px;">
            <div class="text-center mb-3">
                <img src="imagenes/logo-gt-pro.png" alt="Rines GT Pro" style="height:62px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.15));">
            </div>
            <h2 class="login-titulo">Iniciar Sesión</h2>
            <p class="login-subtitulo">Ingresa para administrar el sistema o consultar tus compras y diseños</p>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Usuario o Correo Electrónico</label>
                    <input type="text" id="usuario" class="form-control" required placeholder="admin o tu correo registrado" autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Contraseña</label>
                    <input type="password" id="clave" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-gt-primario w-100 py-3 fw-bold" id="btnLoginSubmit">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar a la Plataforma
                </button>
                <div id="mensajeError" class="mensaje-error text-center mt-3 fw-bold"></div>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <p class="mb-0" style="font-size:0.9rem;">
                    ¿Eres nuevo cliente? <a href="registro.html" style="color:#8C1F1F; font-weight:700;">Regístrate aquí gratis</a>
                </p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/movil-pwa.js"></script>
</body>
</html>
