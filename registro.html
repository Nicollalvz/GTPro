<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crear Cuenta — Rines y Llantas GT Pro</title>
    
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="apple-touch-icon" href="imagenes/app-icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8C1F1F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rines GT Pro">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="imagenes/logo-gt-pro.png" alt="Rines y Llantas GT Pro" class="logo-navbar">
                <span class="logo-texto d-none d-sm-inline">RINES & LLANTAS GT <span>PRO</span></span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="login-seccion">
        <div class="login-caja" style="max-width:550px;">
            <div class="text-center mb-3">
                <img src="imagenes/logo-gt-pro.png" alt="Rines GT Pro" style="height:55px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.15));">
            </div>
            <h2 class="login-titulo">Crear Cuenta de Cliente</h2>
            <p class="login-subtitulo">Regístrate para ver el catálogo, guardar tus diseños con IA y revisar tus facturas.</p>
            
            <form id="formRegistroCliente">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Nombre Completo *</label>
                        <input type="text" id="reg_nombre" class="form-control" required placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Correo Electrónico *</label>
                        <input type="email" id="reg_email" class="form-control" required placeholder="tucorreo@email.com">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Teléfono / WhatsApp *</label>
                        <input type="tel" id="reg_telefono" class="form-control" required placeholder="355 581 7510">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Ciudad *</label>
                        <input type="text" id="reg_ciudad" class="form-control" placeholder="Sogamoso, Boyacá">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Dirección de Entrega</label>
                    <input type="text" id="reg_direccion" class="form-control" placeholder="Calle 15 # 12-45">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Crear Contraseña *</label>
                    <input type="password" id="reg_clave" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>

                <button type="submit" class="btn btn-gt-primario w-100 py-3 fw-bold" id="btnCrearCuenta">
                    <i class="bi bi-person-check-fill"></i> Crear Mi Cuenta
                </button>
                <p id="mensajeRegistro" style="margin-top:15px; font-weight:600; text-align:center;"></p>
            </form>

            <p style="margin-top:20px; text-align:center; font-size:0.9rem;">
                ¿Ya eres cliente? <a href="login.html" style="color:#8C1F1F; font-weight:700;">Inicia sesión aquí</a>
            </p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('formRegistroCliente');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = document.getElementById('btnCrearCuenta');
                const cajaMensaje = document.getElementById('mensajeRegistro');

                const nombre = document.getElementById('reg_nombre').value.trim();
                const email = document.getElementById('reg_email').value.trim();
                const telefono = document.getElementById('reg_telefono').value.trim();
                const ciudad = document.getElementById('reg_ciudad').value.trim();
                const direccion = document.getElementById('reg_direccion').value.trim();
                const clave = document.getElementById('reg_clave').value;

                if (clave.length < 6) {
                    cajaMensaje.textContent = '⚠️ La contraseña debe tener al menos 6 caracteres';
                    cajaMensaje.style.color = '#dc3545';
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Registrando en la base de datos...';
                cajaMensaje.textContent = '';

                try {
                    const res = await fetch('api/auth.php?accion=registro', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ nombre, email, telefono, ciudad, direccion, clave })
                    });
                    const data = await res.json();

                    if (data.exito) {
                        cajaMensaje.textContent = '✅ ¡Cuenta creada exitosamente! Redirigiendo a tu panel...';
                        cajaMensaje.style.color = '#28a745';

                        // Guardar datos de sesión local
                        localStorage.setItem('sesionActivaCliente', 'true');
                        localStorage.setItem('clienteId', data.usuario.id);
                        localStorage.setItem('nombreCliente', data.usuario.nombre);
                        localStorage.setItem('emailCliente', data.usuario.email);

                        setTimeout(() => {
                            const params = new URLSearchParams(window.location.search);
                            const destino = params.get('destino') || 'panel-cliente.html';
                            window.location.href = destino;
                        }, 1200);
                    } else {
                        cajaMensaje.textContent = '⚠️ ' + data.mensaje;
                        cajaMensaje.style.color = '#dc3545';
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-person-check-fill"></i> Crear Mi Cuenta';
                    }
                } catch (err) {
                    cajaMensaje.textContent = 'Error al conectar con el servidor.';
                    cajaMensaje.style.color = '#dc3545';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-person-check-fill"></i> Crear Mi Cuenta';
                }
            });
        });
    </script>
    <script src="js/auth.js"></script>
    <script src="js/movil-pwa.js"></script>
</body>
</html>
